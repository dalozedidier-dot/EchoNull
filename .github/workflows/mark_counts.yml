name: mark_counts

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id"
        required: true
        default: "1"
      seed:
        description: "Seed"
        required: true
        default: "1000"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run mark_counts
        env:
          RUN_ID: ${{ inputs.run_id }}
          SEED: ${{ inputs.seed }}
        run: |
          mkdir -p _ci_out
          python -c "import os; from pathlib import Path; from echonull.mark_counts.analyzer import MarkCountsAnalyzer; out=Path('_ci_out'); out.mkdir(parents=True, exist_ok=True); print(MarkCountsAnalyzer().analyze(run_id=int(os.environ['RUN_ID']), seed=int(os.environ['SEED']), data=None, output_dir=out))"

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: mark_counts_out
          path: _ci_out/mark_counts
