name: graph_analysis

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id"
        required: true
        default: "1"
      seed:
        description: "Seed"
        required: true
        default: "1000"
      thresholds:
        description: "Comma-separated thresholds"
        required: false
        default: "0.25,0.5,0.7,0.8"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run graph_analysis
        env:
          RUN_ID: ${{ inputs.run_id }}
          SEED: ${{ inputs.seed }}
          THRESHOLDS: ${{ inputs.thresholds }}
        run: |
          mkdir -p _ci_out
          python -c "import os; from pathlib import Path; from echonull.graph_analysis.analyzer import GraphAnalysisAnalyzer; thr=[float(x) for x in os.environ['THRESHOLDS'].split(',') if x.strip()]; out=Path('_ci_out'); out.mkdir(parents=True, exist_ok=True); print(GraphAnalysisAnalyzer(thr).analyze(run_id=int(os.environ['RUN_ID']), seed=int(os.environ['SEED']), data=None, output_dir=out))"

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: graph_analysis_out
          path: _ci_out/graph_analysis
