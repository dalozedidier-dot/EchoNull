name: extended-tests

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Number of runs for soak sweep"
        required: false
        default: "50"
      thresholds:
        description: "Comma-separated thresholds"
        required: false
        default: "0.25,0.5,0.7,0.8"
      workers:
        description: "Worker processes"
        required: false
        default: "2"
  schedule:
    - cron: "23 2 * * *"

jobs:
  extended:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run extended tests
        run: |
          pytest -q extended_tests

      - name: Soak sweep
        run: |
          RUNS="${{ github.event.inputs.runs }}"
          THR="${{ github.event.inputs.thresholds }}"
          WORKERS="${{ github.event.inputs.workers }}"
          if [ -z "$RUNS" ]; then RUNS="50"; fi
          if [ -z "$THR" ]; then THR="0.25,0.5,0.7,0.8"; fi
          if [ -z "$WORKERS" ]; then WORKERS="2"; fi
          python -m echonull.orchestrator.run --runs "$RUNS" --thresholds "$THR" --workers "$WORKERS" --out _soak_out --zip

      - name: Upload soak artifacts
        uses: actions/upload-artifact@v4
        with:
          name: echonull_soak_out
          path: |
            _soak_out
            _soak_out.zip
