[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]
fix = false
extend-exclude = [
  "mnt",
  "tools",
  "_ci_out",
  "build",
  "dist",
  ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "N", "UP", "SIM", "C4", "RUF"]
ignore = []
mccabe.max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["echonull", "benchmarks"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = true
warn_unused_configs = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
branch = false
source = ["echonull"]
omit = ["**/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 100
